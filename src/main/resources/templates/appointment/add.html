<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Appointment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h2>Create Appointment</h2>

    <form th:action="@{/appointments/save}" th:object="${appointment}" method="post" class="form-horizontal">
        <div class="mb-3">
            <label for="appointmentDate" class="form-label">Appointment Date</label>
            <input type="datetime-local" id="appointmentDate" th:field="*{appointmentDate}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" th:field="*{status}" class="form-select" required>
                <option value="Booked">Booked</option>
                <option value="Canceled">Canceled</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="doctor" class="form-label">Doctor</label>
            <select id="doctor" th:field="*{doctor.id}" class="form-select" required>
                <option th:each="doctor : ${doctors}" th:value="${doctor.id}" th:text="${doctor.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="patient" class="form-label">Patient</label>
            <select id="patient" th:field="*{patient.id}" class="form-select" required>
                <option th:each="patient : ${patients}" th:value="${patient.id}" th:text="${patient.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save Appointment</button>
    </form>
</div>

</body>
</html>
