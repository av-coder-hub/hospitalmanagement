<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>
</head>
<body>
    <h1>Edit Patient</h1>
    <form th:action="@{/patients/save}" th:object="${patient}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required />
        <br />
        
        <label for="age">Age:</label>
        <input type="number" id="age" th:field="*{age}" required />
        <br />

        <label for="gender">Gender:</label>
        <select id="gender" th:field="*{gender}" required>
            <option value="Male" th:selected="${patient.gender == 'Male'}">Male</option>
            <option value="Female" th:selected="${patient.gender == 'Female'}">Female</option>
        </select>
        <br />

        <button type="submit">Update Patient</button>
    </form>
</body>
</html>
