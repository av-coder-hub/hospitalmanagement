<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient List</title>
</head>
<body>
    <h1>Patient List</h1>
    <a href="/patients/add">Add New Patient</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.id}"></td>
                <td th:text="${patient.name}"></td>
                <td th:text="${patient.age}"></td>
                <td th:text="${patient.gender}"></td>
                <td>
                    <a th:href="@{/patients/edit/{id}(id=${patient.id})}">Edit</a>
                    <a th:href="@{/patients/delete/{id}(id=${patient.id})}" onclick="return confirm('Are you sure you want to delete this patient?');">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
