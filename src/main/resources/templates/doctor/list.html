<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctors</title>
</head>
<body>
    <h1>Doctors List</h1>
    <a href="/doctors/add">Add New Doctor</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialty</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="doctor : ${doctors}">
                <td th:text="${doctor.id}"></td>
                <td th:text="${doctor.name}"></td>
                <td th:text="${doctor.specialty}"></td>
                <td>
                    <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}">Edit</a> |
                    <a th:href="@{/doctors/delete/{id}(id=${doctor.id})}">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
